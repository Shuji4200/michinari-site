<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MICHINARI事業</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Inter:wght@500;600;700;800&family=Lexend:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181d; --ink2:#3d424d; --mute:#8a909c; --line:#e7e9ee; --bg:#f6f7f9; --card:#fff;
  --accent:#2b3a67; --accent-soft:#eef1f8; --red:#e5484d; --red-soft:#fdeeee; --ok:#1f9d6b; --ok-soft:#e8f6ef;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:12px;align-items:center;padding:22px 20px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 20px Inter;position:relative}
.logo:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--red);top:7px;right:8px}
.brand b{display:block;font:700 16px Inter;letter-spacing:.02em}
.brand small{color:var(--mute);font-size:11.5px}
.nav{padding:14px 10px;flex:1;overflow:auto}
.nav h6{margin:16px 12px 6px;font-size:11px;color:var(--mute);font-weight:500;letter-spacing:.08em}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font-size:14px;color:var(--ink2)}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav .cnt{margin-left:auto;font:600 11px Inter;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%}
.me{border-top:1px solid var(--line);padding:14px 18px;font-size:12px;color:var(--mute)}
/* main */
main{min-width:0;padding:44px 56px 80px;max-width:1240px;width:100%;margin:0 auto}
.hero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px 36px;display:grid;grid-template-columns:120px 1fr 280px;gap:32px;align-items:center}
.ring{position:relative;width:116px;height:116px}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 30px Inter}
.ring .num small{font:500 13px Inter;color:var(--mute)}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--mute);font-weight:700}
.hero h1{margin:6px 0 10px;font-size:30px;font-weight:900;letter-spacing:.02em}
.hero p{margin:0;color:var(--ink2);font-size:14px;line-height:1.7}
.next{border-left:1px solid var(--line);padding-left:28px}
.next h3{margin:6px 0 2px;font-size:17px}
.next .sub{font-size:12px;color:var(--mute)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px;margin-top:14px}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.done{background:var(--ok)}
/* stages */
.stages{position:relative;margin-top:44px}
.stage{position:relative;padding-left:86px;margin-bottom:44px}
.stage:before{content:"";position:absolute;left:31px;top:66px;bottom:-44px;width:2px;background:var(--line)}
.stage:last-child:before{display:none}
.node{position:absolute;left:0;top:4px;width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font:800 18px Inter;color:var(--mute)}
.stage.cur .node{border-color:var(--c);color:var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 14%,transparent)}
.stage.fin .node{background:var(--c);border-color:var(--c);color:#fff}
.shead{display:flex;align-items:flex-end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.shead .lab{font:700 12px Inter;letter-spacing:.12em;color:var(--c)}
.shead h2{margin:6px 0 6px;font-size:24px;font-weight:900}
.shead p{margin:0;color:var(--ink2);font-size:13.5px}
.sprog{margin-left:auto;text-align:right;min-width:150px}
.sprog b{font:800 18px Inter;color:var(--c)} .sprog span{font:500 13px Inter;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:9px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px 22px;min-height:178px;display:flex;flex-direction:column;position:relative;transition:.15s;text-align:left}
.card:hover{border-color:var(--c);transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,24,40,.06)}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card .no{width:34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font:700 13px Inter;color:var(--mute)}
.card.isnext{border:2px solid var(--c)}
.card.isnext .no{background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.card.isdone .no{background:var(--ok-soft);color:var(--ok)}
.tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px}
.tag.next{background:var(--c);color:#fff}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.draft{background:var(--bg);color:var(--mute)}
.card h4{margin:0 0 8px;font-size:16px;font-weight:700;line-height:1.45}
.card p{margin:0;font-size:12.5px;line-height:1.7;color:var(--mute)}
.card.isnext p{color:var(--ink2)}
.card .meta{margin-top:auto;padding-top:12px;font:500 11.5px Inter;color:var(--mute)}
.card.draft h4{color:var(--ink2)}
/* lesson */
.crumb{font-size:13px;color:var(--mute);margin-bottom:18px}
.crumb a:hover{color:var(--ink)}
.lesson{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 48px;max-width:860px}
.lesson .lab{font:700 12px Inter;letter-spacing:.12em;color:var(--c)}
.lesson h1{font-size:28px;font-weight:900;margin:8px 0 12px}
.lesson .lead{font-size:15px;color:var(--ink2);line-height:1.8;margin:0 0 8px}
.lesson .info{display:flex;gap:16px;font-size:12.5px;color:var(--mute);margin-bottom:28px}
.sec{border-top:1px solid var(--line);padding-top:26px;margin-top:26px}
.sec h2{font-size:19px;margin:0 0 14px;display:flex;gap:10px;align-items:center}
.sec h2 i{font:800 12px Inter;font-style:normal;color:#fff;background:var(--c);border-radius:6px;padding:3px 7px}
.body{font-size:14.5px;line-height:1.95;color:var(--ink2)}
.body p{margin:0 0 12px}
.body ul{margin:0 0 12px;padding-left:1.3em}
.body li{margin-bottom:4px}
.body strong{color:var(--ink)}
.body .callout{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:8px;margin:0 0 12px;color:var(--ink)}
.points{background:var(--red-soft);border-radius:14px;padding:20px 24px;margin-top:28px}
.points h3{margin:0 0 10px;font-size:14px;color:var(--red)}
.points ul{margin:0;padding-left:1.2em;font-size:14px;line-height:1.9}
.check{margin-top:26px}
.check h3{font-size:15px;margin:0 0 10px}
.check label{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--c)}
.empty{padding:34px;text-align:center;color:var(--mute);background:var(--bg);border-radius:14px;font-size:14px;line-height:1.8}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:34px;gap:12px;flex-wrap:wrap}
.pager{display:flex;gap:10px}
.note{max-width:860px;margin-top:14px;font-size:12px;color:var(--mute)}
.banner{background:#fff8e6;border:1px solid #f3e1a7;color:#7a5a00;border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:20px}
.loading{color:var(--mute);padding:60px 0;text-align:center}
/* CRM */
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph h1{margin:4px 0 0;font-size:28px;font-weight:900}
.ph .act{margin-left:auto;display:flex;gap:10px;align-items:center}
.ph .btn{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-bottom:6px}
.kpi b{font:800 24px Inter}.kpi span{font-size:12px;color:var(--mute);margin-left:3px}
.kpi.warn b{color:var(--red)}
.tools{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;background:#fff}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
.board{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#eef0f3;border-radius:14px;padding:12px;min-height:200px}
.col h5{margin:2px 4px 12px;font-size:13px;display:flex;align-items:center;gap:7px}
.col h5 em{font:600 11px Inter;font-style:normal;color:var(--mute);margin-left:auto}
.cc{display:block;background:#fff;border-radius:10px;padding:12px 13px;margin-bottom:9px;border:1px solid transparent;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.cc:hover{border-color:var(--accent)}
.cc b{display:block;font-size:14px;margin-bottom:3px}
.cc .p{font-size:12px;color:var(--mute)}
.cc .na{margin-top:8px;font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:7px}
.cc .na.late{color:var(--red);font-weight:700}
.cc .row{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font:600 12px Inter}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--ink2);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;color:#fff}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:11px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
.t td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr:hover td{background:#fafbfc}
.t td a{font-weight:700}
.t select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;background:#fff}
.late{color:var(--red);font-weight:700}
.dgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 26px}
.panel h3{margin:0 0 14px;font-size:15px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 14px;font-size:14px}
.kv dt{color:var(--mute);font-size:12.5px;padding-top:2px}.kv dd{margin:0;word-break:break-all}
.memo{white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--ink2)}
.log textarea,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical}
.log ul{list-style:none;padding:0;margin:16px 0 0}
.log li{border-left:2px solid var(--line);padding:2px 0 14px 14px;position:relative;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
.log li:before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.log li small{display:block;color:var(--mute);font:500 11.5px Inter}
.modal{position:fixed;inset:0;background:rgba(15,18,28,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:720px;padding:28px 30px}
.mbox h2{margin:0 0 18px;font-size:20px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink2);font-weight:500}
.f label.w{grid-column:1/-1}
.f input,.f select{border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;background:#fff}
.f .chk{display:flex;flex-wrap:wrap;gap:8px 14px;font-weight:400;font-size:13.5px}
.f .chk span{display:flex;gap:6px;align-items:center}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.mfoot .btn{margin-top:0}
.btn.danger{background:#fff;color:var(--red);border:1px solid #f3c6c7}
.btn.danger.arm{background:var(--red);color:#fff}
.btn.sm{padding:8px 14px;font-size:13px}
.err{color:var(--red);font-size:13px;margin-top:10px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.dgrid{grid-template-columns:1fr}}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.f{grid-template-columns:1fr}.t{display:block;overflow-x:auto}}
/* ===== MICHINARI事業 ===== */
.nav a .ic{font-style:normal;width:20px;text-align:center;font-size:15px}
.nav a.sub{padding:7px 12px 7px 42px;min-height:36px;font-size:13px}
.nav a.sub.on{background:none;color:var(--accent);font-weight:700}
.nav a.todo{color:var(--mute)}
.nav .soon{margin-left:auto;font-size:10px;color:var(--mute);background:var(--bg);border-radius:99px;padding:2px 7px}
.nav .cnt.red{color:#fff;background:var(--red);border-radius:99px;padding:1px 7px}
.dsec{margin-bottom:22px}
.dsec>h3,.dh h3{margin:0 0 12px;font-size:15px}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px}.dh h3{margin:0}.dh h3 em{font:600 12px Inter;font-style:normal;color:var(--mute);margin-left:4px}
.dh>*:last-child{margin-left:auto}.dh>h3:only-child{margin-left:0}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.goal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.goal small{font-size:12.5px;color:var(--mute)}
.gv{display:flex;align-items:baseline;gap:4px;margin:6px 0 10px;flex-wrap:wrap}.gv b{font:800 28px Inter}.gv span{font-size:13px;color:var(--mute)}.gv em{font-style:normal;font-size:12px;color:var(--mute);margin-left:6px}
.goal .bar i{background:var(--accent)}
.gs{font-size:12px;color:var(--ink2);margin-top:8px}.mute{color:var(--mute)}.s{font-size:12px}
.dgrid2{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
.seg.sm button{padding:5px 10px;font-size:12px;min-height:32px}
.funnel{display:flex;flex-direction:column;gap:12px}
.fr{display:grid;grid-template-columns:92px 1fr 36px 44px;align-items:center;gap:10px;font-size:13px}
.fl{color:var(--ink2);font-weight:500}.fb{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}.fb i{display:block;height:100%;border-radius:6px;min-width:2px}
.fr b{font:800 16px Inter;text-align:right}.fc{font:600 12px Inter;color:var(--mute);text-align:right}
.hint{font-size:12px;color:var(--mute);margin:12px 0 0;line-height:1.7}
.lnk{font-size:13px;color:var(--accent);font-weight:700}
.todo{list-style:none;margin:0;padding:0}
.todo li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.todo li.over{border-color:#f3c6c7;background:#fffafa}
.tr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}.tr1 .pill{font-size:11px;padding:3px 8px}
.td{font:700 12px Inter;color:var(--ink2)}.over .td{color:var(--red)}
.tr2{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13.5px;color:var(--ink2)}.tr2 .btn{margin:0 0 0 auto;background:var(--ok);min-height:36px}
.tr3{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.tr3 input,.inp{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:13.5px;min-height:38px}.tr3 input:first-child{flex:1;min-width:160px}.tr3 .btn{margin:0;min-height:38px}
.empty.sm{padding:22px;font-size:13px}
.wkcard{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-top:4px}
.wkcard>span{font-size:24px}.wkcard b{display:block;font-size:15px}.wkcard small{color:var(--mute);font-size:12px}.wkcard em{margin-left:auto;font-style:normal;font-weight:700;color:var(--accent);font-size:13px}
.wkcard:hover{border-color:var(--accent)}
.isg{margin-bottom:22px}.isg h4{margin:0 0 8px;font-size:14px;display:flex;gap:8px;align-items:center}.isg h4 em{font:600 12px Inter;font-style:normal;color:var(--mute)}
.isg.over h4{color:var(--red)}.isg.today h4{color:var(--accent)}
.w110{width:90px;font:600 13px Inter}
.planned p{font-size:14px;line-height:1.9;color:var(--ink2);margin:14px 0 0}.planned .sub{font-size:12.5px;color:var(--mute)}
.wklist{display:flex;flex-direction:column;gap:10px}
.wkrow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.wkrow:hover{border-color:var(--accent)}.wkrow b{display:block;font-size:15px}.wkrow small{font-size:12px;color:var(--mute)}.wkrow em{margin-left:auto;font-style:normal;color:var(--mute)}
.wsec{margin-bottom:16px}.wsec>h3{margin:0 0 12px;font-size:15px}
.wsec.prev{background:#fbfcfe}
.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.kc{background:var(--bg);border-radius:12px;padding:12px}.kc small{display:block;font-size:11.5px;color:var(--mute);margin-bottom:4px;line-height:1.4}.kc b{font:800 20px Inter}.kc span{font-size:11px;color:var(--mute);margin-left:2px}.kc em{display:block;font-style:normal;font-size:11px;color:var(--accent);margin-top:2px}
.lb{margin-top:18px}.wsec .lb:first-child{margin-top:0}
.lb h3{margin:0 0 10px;font-size:15px}.lb h3 em{font:600 12px Inter;font-style:normal;color:var(--mute)}
.lrows{list-style:none;margin:0;padding:0}
.lrows li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.6}
.lrows li.nob{border:0}
.lrows label{display:flex;gap:10px;align-items:flex-start;flex:1;cursor:pointer}.lrows input{margin-top:5px;width:16px;height:16px;accent-color:var(--ok)}
.lrows li>span{flex:1}.strike{text-decoration:line-through;color:var(--mute)}
.kvl{flex:1;color:var(--ink2)}.kvv{font:700 14px Inter}
.x{border:0;background:none;color:var(--mute);font-size:18px;width:32px;height:32px;border-radius:8px;flex:none}.x:hover{background:var(--red-soft);color:var(--red)}
.addrow{display:flex;gap:8px;margin-top:10px}.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;min-height:44px}.addrow input.short{flex:0 0 120px}.addrow .btn{margin:0;min-height:44px}
@media(max-width:1100px){.goals{grid-template-columns:repeat(2,1fr)}.dgrid2{grid-template-columns:1fr}.kgrid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){
  body.menu .side{display:flex;position:fixed;inset:0 0 64px 0;z-index:40;height:auto;overflow:auto}
  body.menu .side .nav{display:block}
  .kgrid{grid-template-columns:repeat(2,1fr)}.tab{font-size:10px}
  .addrow{flex-wrap:wrap}.addrow input.short{flex:1}
}

.dlinks{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 18px;align-items:center}.dlinks a{font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink)}.dlinks a:hover{border-color:var(--accent)}
.dal{font-size:12px;color:var(--red);font-weight:600}.dlinks a.ext{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.h3{font-size:15px;margin:0 0 12px}
.pks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.pk.hit{border-color:#bfe5d3}.pk.miss{border-color:#f3c6c7}
.pk small{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);margin-bottom:6px}.pk .man{font-style:normal;font-size:10px;background:#f1f2f5;border-radius:4px;padding:1px 5px}
.pkv{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px}.pkv b{font:800 21px Inter}.pkv span{font-size:12px;color:var(--mute)}.pkv em{font-style:normal;font-size:12px;color:var(--mute);margin-left:4px}
.pk .bar{height:6px;background:#eef0f4;border-radius:3px;margin-top:10px;overflow:hidden}.pk .bar i{display:block;height:100%;background:var(--accent)}.pk.hit .bar i{background:var(--ok)}
.pk .gs{font-size:11px;color:var(--mute);margin-top:6px}.pk.hit .gs{color:var(--ok);font-weight:700}
.pdca{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pcol{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-top:4px solid var(--c);min-height:180px;display:flex;flex-direction:column;gap:10px}
.pcol.P{--c:#3b82f6}.pcol.D{--c:#f59e0b}.pcol.C{--c:#8b5cf6}.pcol.A{--c:#1f9d6b}
.pch{display:flex;align-items:center;gap:8px}.pch b{font-size:14px}.pch em{font-style:normal;font-size:12px;color:var(--mute)}.pch .btn{margin-left:auto;padding:4px 10px;min-height:0}
.pl{width:24px;height:24px;border-radius:7px;background:var(--c);color:#fff;font:800 13px Inter;display:grid;place-items:center}
.ptxt{font-size:13px;line-height:1.7}.ptxt p{margin:0 0 6px}.ptxt ul{margin:0;padding-left:18px}
.pph{font-size:12px;color:var(--mute);line-height:1.6}
.pprev{font-size:12px;background:#f6f7f9;border-radius:8px;padding:8px 10px}.pprev small{display:block;color:var(--mute);font-weight:700;margin-bottom:2px}.pprev p{margin:0}.pprev ul{margin:0;padding-left:16px}
.pauto{font-size:13px;background:#f5f3ff;border-radius:8px;padding:8px 10px}
.pacts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pacts li{display:flex;align-items:flex-start;gap:6px;font-size:13px}.pacts label{display:flex;gap:6px;flex:1;cursor:pointer;line-height:1.5}.pacts input{margin-top:3px}
.pacts li.done span{color:var(--mute);text-decoration:line-through}.pacts small{font-size:11px;color:var(--mute);white-space:nowrap}.pacts li.late small{color:var(--red);font-weight:700}
.px{border:0;background:none;color:#b4b9c2;cursor:pointer;font-size:14px;padding:0 2px}.px.arm{color:var(--red);font-size:11px;font-weight:700}
.padd{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap}.padd #pdText{flex:1 1 100%}.padd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}.padd input[type=date]{flex:1 1 auto;height:34px;padding:4px 8px}.padd .btn{height:34px}
.pnext{margin-top:auto;align-self:flex-start}
.dcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dcard{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:4px solid var(--c);color:inherit;transition:.15s}.dcard:hover{box-shadow:0 4px 14px rgba(20,30,60,.08)}
.dch{display:flex;align-items:center;gap:6px;margin-bottom:8px}.dch b{font-size:15px}.dch small{font:700 11px Inter;color:var(--c)}.dci{font-size:16px}
.dsc{margin-left:auto;font-size:11px;font-weight:700;color:var(--mute);background:#f1f2f5;border-radius:999px;padding:2px 8px}.dsc.ok{color:#fff;background:var(--ok)}
.dk{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:4px}.dk li{display:flex;align-items:baseline;gap:6px;font-size:12px}.dk span{color:var(--mute);flex:1}.dk b{font:700 14px Inter}.dk b small{font-size:11px;color:var(--mute);margin-left:1px}.dk em{font-style:normal;font-size:11px;color:var(--mute)}.dk em.ok{color:var(--ok);font-weight:700}
.dpd{display:flex;gap:4px;flex-wrap:wrap}.pd{font:700 11px Inter;padding:2px 7px;border-radius:5px;background:#f1f2f5;color:#a0a5b0}.pd.on{background:var(--c);color:#fff}
.dcard .dal{margin-top:8px}
@media(max-width:1100px){.pdca{grid-template-columns:repeat(2,minmax(0,1fr))}.dcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.pdca,.dcards{grid-template-columns:1fr}.pks{grid-template-columns:repeat(2,minmax(0,1fr))}.pk{padding:12px}.pkv b{font-size:18px}.mnav{flex:1}.mnav .btn{flex:0 0 auto}.mnav b{flex:1}#kEdit{white-space:nowrap;width:auto!important;flex:0 0 auto!important}.pcol{min-height:0}}

.demobar{background:#2b3a67;color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px 12px}
body.ro [data-ped],body.ro #kEdit,body.ro .padd,body.ro [data-pdel],body.ro #pCarry,body.ro [data-done],body.ro .dlinks a,body.ro #pErr{display:none!important}
body.ro [data-pdo]{pointer-events:none}
</style>

<body>
<div class="mtop"><div class="logo" style="width:32px;height:32px;font-size:17px">m</div><b>MICHINARI事業</b></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">m</div><div><b>MICHINARI事業</b><small>経営ダッシュボード</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="me" id="me">読み込み中…</div>
  </aside>
  <main id="main"><div class="loading">読み込み中…</div></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
const COLORS={product:"#2b3a67",acquisition:"#e5484d",sales:"#1f9d6b"};
const APP_MODE="public"; /* build_dept.py が部門アプリ用に書き換える */
const IS_MAIN=APP_MODE==="main"||APP_MODE==="public"; /* public＝GitHub公開デモ（サンプルデータ・表示のみ） */
const DEPT_URL={ceo:"https://claude.ai/artifact/Wpeio4RoYmBtWeFhWUyHzW",cso:"https://claude.ai/artifact/NdYfQVJVwmKLknjkjTGfqp",cmo:"https://claude.ai/artifact/CN24agrwF3i3jyo8AVs8LZ",cpo:"https://claude.ai/artifact/6rz9jPxcGmGgUAEbZ5tPHK",chro:"https://claude.ai/artifact/RkMZCBt7JyLZaqXWU3h1yD",cfo:"https://claude.ai/artifact/8tbbPu9Vga31o2T5RHGbRk",clo:"https://claude.ai/artifact/HnHtUyPZrVVDjYGE3UGEZm"};
/* 部門アプリが持つデータ（＝そのアプリで編集する元データ）と、参照用コピー */
const OWN={ceo:["biz"],cso:["crm","clients","salesdocs"],cmo:["mkt","mktposts"],cpo:["products"],chro:["stages","lessons"],cfo:["payments"],clo:["legal"]};
const COPY={cso:["products"],cfo:["clients"]};
const LOCAL=IS_MAIN?null:new Set([...(OWN[APP_MODE]||[]),...(COPY[APP_MODE]||[])]);
const state={payments:{},rawClients:[],stages:[],lessons:[],done:{},checks:{},uid:null,db:null,progRef:null,ready:false,err:null,stale:false,canSave:true};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
function md(t){
  const out=[];let list=null;
  String(t||"").split("\n").forEach(raw=>{
    const l=raw.trim();
    if(/^[-・]\s*/.test(l)&&l.length>1&&(l[0]==="-"||l[0]==="・")){ (list||(list=[])).push("<li>"+inline(l.replace(/^[-・]\s*/,""))+"</li>");return;}
    if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;}
    if(!l)return;
    if(l.startsWith(">"))out.push('<div class="callout">'+inline(l.replace(/^>\s*/,""))+"</div>");
    else out.push("<p>"+inline(l)+"</p>");
  });
  if(list)out.push("<ul>"+list.join("")+"</ul>");
  return out.join("");
}
const colorOf=st=>st?.color||COLORS[st?.id]||"#2b3a67";
const stageLessons=id=>state.lessons.filter(l=>l.stage===id).sort((a,b)=>(a.order||0)-(b.order||0));
const ordered=()=>state.stages.flatMap(s=>stageLessons(s.id));
const nextLesson=()=>ordered().find(l=>!state.done[l.id]&&l.status==="published")||ordered().find(l=>!state.done[l.id]);

function render(){
  const ae=document.activeElement,keep=ae&&ae.id&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")?{id:ae.id,v:ae.value,s:ae.selectionStart}:null;
  renderNav();route();
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.s);}catch(e){}}}
}
function route(){
  const h=location.hash.replace("#","");
  const biz=h===""||h==="home"||h.startsWith("d-")||h==="plan"||h==="finance"||h==="legal"||h==="products"||h==="marketing"||h==="docs"||h==="clients"||h.startsWith("client-")||h==="crm"||h.startsWith("crm-")||h==="weekly"||h.startsWith("weekly-")||PLANNED[h];
  const trainR=h==="training"||h.startsWith("stage-")||h.startsWith("lesson-");
  if(IS_PUBLIC&&!(h===""||h==="home"||h.startsWith("d-"))){location.hash="";return;}
  if(state.isEditor&&!IS_MAIN&&!biz&&!(APP_MODE==="chro"&&trainR)){location.hash="";return;}
  if(state.isEditor&&biz&&!IS_MAIN){
    if(!state.crmReady){$("#main").innerHTML='<div class="loading">データを読み込み中…</div>';return;}
    const D=deptOf(APP_MODE),ok=h===""||h==="home"||h==="d-"+APP_MODE||D.pages.some(p=>{const x=p[0].slice(1);return h===x||(x==="crm"&&h.startsWith("crm-"))||(x==="clients"&&h.startsWith("client-"))||(x==="training"&&(h.startsWith("stage-")||h.startsWith("lesson-")))||(x==="plan"&&h==="strategy");});
    if(!ok){location.hash="";return;}
    if(h===""||h==="home"||h==="d-"+APP_MODE)return renderDept(APP_MODE);
  }
  if(state.isEditor&&biz){
    if(!state.crmReady){$("#main").innerHTML='<div class="loading">事業データを読み込み中…</div>';return;}
    if(h===""||h==="home")return renderDash();
    if(h.startsWith("d-"))return renderDept(h.slice(2));
    if(h==="crm")return renderCRM();
    if(h==="docs")return renderDocs();
    if(h==="finance")return renderFinance();
    if(h==="legal")return renderLegal();
    if(h==="products")return renderProducts();
    if(h==="marketing")return renderMkt();
    if(h==="clients")return renderClients();
    if(h.startsWith("client-"))return renderClient(h.slice(7));
    if(PLANNED[h]&&h!=="strategy"){location.hash="";return;}
    if(h.startsWith("crm-"))return renderCustomer(h.slice(4));
    if(h==="strategy"){location.hash="plan";return;}
    if(h==="plan")return renderPlan();
    if(h==="weekly"||h.startsWith("weekly-")){location.hash="";return;}
    return renderPlanned(h);
  }
  if(!state.bizChecked&&!state.static&&biz&&h!=="training"){$("#main").innerHTML='<div class="loading">読み込み中…</div>';return;}
  if(h&&h!=="training"&&biz&&state.bizChecked){$("#main").innerHTML='<div class="empty">このページは編集権限のあるメンバーだけが見られます。<br><a href="#" style="color:var(--accent)">育成ロードマップへ →</a></div>';return;}
  if(!state.ready){$("#main").innerHTML='<div class="loading">'+(state.err||"読み込み中…")+"</div>";return;}
  if(h.startsWith("lesson-"))return renderLesson(h.slice(7));
  if(h.startsWith("stage-"))return renderHome(h.slice(6));
  renderHome();
}
function renderNav(){
  const all=ordered(),h=location.hash||"#";
  const doneN=all.filter(l=>state.done[l.id]).length;
  const inTrain=h==="#training"||h.startsWith("#stage-")||h.startsWith("#lesson-")||(!state.isEditor&&h==="#");
  const trainSub=()=>{let x='<a href="'+TR()+'" class="sub '+((h==="#training"||(!state.isEditor&&h==="#"))?"on":"")+'">育成ロードマップ<span class="cnt">'+doneN+"/"+all.length+"</span></a>";
    state.stages.forEach(s=>{const ls=stageLessons(s.id);const d=ls.filter(l=>state.done[l.id]).length;
      x+='<a href="#stage-'+esc(s.id)+'" class="sub '+(h==="#stage-"+s.id?"on":"")+'"><span class="dot" style="background:'+colorOf(s)+'"></span>'+esc(s.title)+'<span class="cnt">'+d+"/"+ls.length+"</span></a>";});return x;};
  let html="";
  if(state.isEditor){
    const late=state.crm.filter(c=>c.nextDate&&c.nextDate<=today()&&c.status!=="lost").length;
    const sub=(href,label,on)=>'<a href="'+href+'" class="sub '+(on?"on":"")+'">'+label+"</a>";
    (IS_MAIN?DEPTS:[deptOf(APP_MODE)]).forEach(D=>{
      const dh=(D.id==="ceo"||!IS_MAIN)?"#":"#d-"+D.id;
      const inPages=D.pages.some(p=>h===p[0]||(p[0]==="#crm"&&h.startsWith("#crm-"))||(p[0]==="#clients"&&h.startsWith("#client-")))||(D.id==="chro"&&inTrain)||(D.id==="ceo"&&(h==="#home"||h==="#strategy"));
      const onDash=dh==="#"?(h==="#"||h==="#home"||h==="#d-"+D.id):h===dh;
      const on=onDash||inPages;
      const badge=D.id==="ceo"?"":D.id==="cso"&&late?'<span class="cnt red">'+late+"</span>":"";
      html+='<a href="'+dh+'" class="'+(on?"on ":"")+((D.id==="ceo"||!IS_MAIN)?"top":"child")+'"><i class="ic">'+D.ic+'</i><span class="ml">'+D.name+'<small class="role">'+D.role+'</small></span>'+badge+"</a>";
      if(on&&!IS_PUBLIC){html+=sub(dh,"ダッシュボード（PDCA）",onDash);
        D.pages.forEach(p=>{if(p[0]==="#training"){html+=trainSub();return;}
          html+=sub(p[0],p[1],h===p[0]||(p[0]==="#crm"&&h.startsWith("#crm-"))||(p[0]==="#clients"&&h.startsWith("#client-"))||(p[0]==="#plan"&&h==="#strategy"));});}
    });
  }else{
    html+="<h6>育成</h6>"+trainSub();
  }
  $("#nav").innerHTML=html;
  document.querySelectorAll("#nav [data-view]").forEach(a=>a.onclick=()=>{state.crmView=a.dataset.view;try{localStorage.setItem("crmView",a.dataset.view);}catch(e){}if(location.hash==="#crm")render();});
  document.querySelectorAll("#nav [data-add]").forEach(a=>a.onclick=e=>{e.preventDefault();if(location.hash!=="#crm")location.hash="crm";setTimeout(()=>openForm(),60);});
  document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>document.body.classList.remove("menu")));
  let tabs;
  if(state.isEditor&&!IS_MAIN){const D=deptOf(APP_MODE);tabs=[["#",D.ic,"ダッシュボード",h==="#"||h==="#home"]].concat(D.pages.slice(0,3).map(p=>[p[0],"•",p[1].replace(/（.*）/,""),h===p[0]||h.startsWith(p[0]+"-")])).concat([["menu","☰","メニュー",false]]);}
  else if(state.isEditor)tabs=[["#","🏛","経営",h==="#"||h==="#home"||h==="#plan"],["#d-cso","🤝","営業",h==="#d-cso"||h.startsWith("#crm")||h==="#docs"||h==="#clients"||h.startsWith("#client-")],["#d-cmo","📣","マーケ",h==="#d-cmo"||h==="#marketing"],["#d-cfo","💴","経理",h==="#d-cfo"||h==="#finance"],["menu","☰","メニュー",false]];
  else tabs=[["#","🧭","ロードマップ",h==="#"]].concat(state.stages.map(st=>["#stage-"+st.id,"●",st.title,h==="#stage-"+st.id,colorOf(st)]));
  $("#tabbar").innerHTML=tabs.map(t=>t[0]==="menu"?`<button class="tab" id="menuBtn"><i>${t[1]}</i>${t[2]}</button>`:`<a class="tab ${t[3]?"on":""}" href="${t[0]}"><i${t[4]?` style="color:${t[4]}"`:""}>${t[1]}</i>${esc(t[2])}</a>`).join("");
  const mb=$("#menuBtn");if(mb)mb.onclick=()=>document.body.classList.toggle("menu");
}
function ring(done,total){
  const r=50,c=2*Math.PI*r,p=total?done/total:0;
  return `<div class="ring"><svg width="116" height="116"><circle cx="58" cy="58" r="${r}" fill="none" stroke="#eef0f4" stroke-width="10"/><circle cx="58" cy="58" r="${r}" fill="none" stroke="#2b3a67" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><div class="num"><span>${done}<small>/${total}</small></span></div></div>`;
}
function renderHome(only){
  const all=ordered(),done=all.filter(l=>state.done[l.id]).length,nx=nextLesson();
  const nxStage=nx&&state.stages.find(s=>s.id===nx.stage);
  let html="";
  if(state.stale)html+='<div class="banner">データに接続できていません。表示が最新でない可能性があります。</div>';
  if(!state.canSave)html+='<div class="banner">この閲覧権限では進捗を保存できません（閲覧のみ）。</div>';
  html+=`<section class="hero">${ring(done,all.length)}<div><div class="eyebrow">MICHINARI 研修カリキュラム</div><h1>育成ロードマップ</h1><p>商品を理解し、集客の仕組みをつくり、営業で成果につなげる。${state.stages.length}ステージ構成のMICHINARI研修コンテンツ</p></div>`;
  html+=nx?`<div class="next"><div class="eyebrow">次に進む</div><h3>${esc(nx.title)}</h3><div class="sub">${esc(nxStage?.title||"")}・レッスン${nx.order||""}</div><a class="btn" href="#lesson-${esc(nx.id)}">このレッスンを始める →</a></div>`
          :`<div class="next"><div class="eyebrow">次に進む</div><h3>${all.length?"全レッスン完了 🎉":"レッスン準備中"}</h3></div>`;
  html+="</section>";
  html+='<div class="chips"><a class="chipbtn '+(only?"":"on")+'" href="'+TR()+'">すべて<em>'+done+'/'+all.length+'</em></a>'+state.stages.map(s=>{const ls=stageLessons(s.id);return '<a class="chipbtn '+(only===s.id?"on":"")+'" href="#stage-'+esc(s.id)+'"><span class="dot" style="background:'+colorOf(s)+'"></span>'+esc(s.title)+'<em>'+ls.filter(l=>state.done[l.id]).length+'/'+ls.length+'</em></a>';}).join("")+'</div>';
  html+="<div class='stages'>";
  if(!state.stages.length)html+='<div class="empty">まだステージがありません。</div>';
  let reachedCur=false;
  state.stages.filter(s=>!only||s.id===only).forEach((s,i)=>{
    const ls=stageLessons(s.id),d=ls.filter(l=>state.done[l.id]).length,c=colorOf(s);
    const fin=ls.length&&d===ls.length;let cls=fin?"fin":"";
    if(!fin&&!reachedCur&&(only||true)){cls="cur";reachedCur=true;}
    html+=`<section class="stage ${cls}" style="--c:${c}"><div class="node">${fin?"✓":String(s.order||i+1).padStart(2,"0")}</div>
    <div class="shead"><div><div class="lab">STAGE ${s.order||i+1} ・ ${esc(s.phase||"")}</div><h2>${esc(s.title)}</h2><p>${esc(s.description||"")}</p></div>
    <div class="sprog"><b>${d}</b><span>/${ls.length}</span><div class="bar"><i style="width:${ls.length?d/ls.length*100:0}%"></i></div></div></div><div class="grid">`;
    if(!ls.length)html+='<div class="empty" style="grid-column:1/-1">レッスンはこれから追加されます</div>';
    ls.forEach(l=>{
      const isD=!!state.done[l.id],isN=nx&&nx.id===l.id,draft=l.status!=="published";
      const tag=isD?'<span class="tag done">完了</span>':isN?'<span class="tag next">次はここ</span>':draft?'<span class="tag draft">準備中</span>':"";
      html+=`<a class="card ${isD?"isdone":""} ${isN?"isnext":""} ${draft?"draft":""}" href="#lesson-${esc(l.id)}"><div class="top"><div class="no">${isD?"✓":String(l.order||"").padStart(2,"0")}</div>${tag}</div><h4>${esc(l.title)}</h4><p>${esc(l.summary||"")}</p>${l.minutes?`<div class="meta">⏱ 約${l.minutes}分</div>`:""}<span class="go">${isD?"✓ 復習する":isN?"▶ 始める":draft?"内容を見る →":"▶ 開く"}</span></a>`;
    });

function withReached(c,status,now){
  const r={...(c.reached||{})};
  const i=STAGE_ORDER.indexOf(status);
  for(let k=0;k<=i;k++){const s=STAGE_ORDER[k];if(!r[s])r[s]=now;}

}
function reached(c,stage){
  if(c.reached&&c.reached[stage])return true;
  if(c.status==="lost")return stage==="lead";

function sanitizeHTML(html){
  const t=document.createElement("template");t.innerHTML=html;
  t.content.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(n=>n.remove());
  t.content.querySelectorAll("*").forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=(a.value||"").trim().toLowerCase();
    if(n.startsWith("on")||n==="contenteditable"||n==="srcdoc"||((n==="href"||n==="src"||n==="xlink:href")&&(v.startsWith("javascript:")||v.startsWith("data:text"))))el.removeAttribute(a.name);});});
  return t.innerHTML;
}
function renderPlan(){

  }

function openForm2({title,fields,values={},onSave,onDelete}){
  const v=values;

    if(f.t==="heading")return `<div class="w fhead">${esc(f.text)}</div>`;
    if(f.t==="numraw")return `<label>${lab}<input name="${f.k}" type="number" inputmode="numeric" value="${esc(val??"")}"></label>`;
    if(f.t==="select")return `<label class="${f.w?"w":""}">${lab}<select name="${f.k}">${f.blank===false?"":'<option value="">—</option>'}${f.o.map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${ov===val?"selected":""}>${esc(ol)}</option>`;}).join("")}</select></label>`;
    if(f.t==="textarea")return `<label class="w">${lab}<textarea name="${f.k}" rows="${f.rows||3}">${esc(val||"")}</textarea></label>`;
    if(f.t==="checks")return `<label class="w">${lab}<div class="chk">${f.o.map(o=>`<span><input type="checkbox" name="${f.k}" value="${esc(o)}" ${(val||[]).includes(o)?"checked":""}>${esc(o)}</span>`).join("")}</div></label>`;
    return `<label class="${f.w?"w":""}">${lab}<input name="${f.k}" type="${f.t||"text"}" value="${esc(val??"")}" placeholder="${esc(f.ph||"")}"></label>`;};
  $("#mbox").innerHTML=`<h2>${esc(title)}</h2><form class="f" id="f2">${fields.map(fld).join("")}</form><div class="err" id="f2Err"></div>
   <div class="mfoot">${onDelete?'<button class="btn danger" id="f2Del" style="margin-right:auto">削除</button>':""}<button class="btn ghost" id="f2C">キャンセル</button><button class="btn" id="f2S">保存する</button></div>`;
  $("#modal").classList.add("open");
  const close=()=>$("#modal").classList.remove("open");
  $("#f2C").onclick=close;$("#f2").onsubmit=e=>e.preventDefault();
  $("#f2S").onclick=async()=>{const fd=new FormData($("#f2"));const d={};
    for(const f of fields){if(f.t==="heading")continue;if(f.t==="numraw"){d[f.k]=(fd.get(f.k)||"").toString().trim();continue;}if(f.t==="checks")d[f.k]=fd.getAll(f.k);else if(f.t==="number"){const x=fd.get(f.k);d[f.k]=x===""||x==null?0:+x;}else d[f.k]=(fd.get(f.k)||"").toString().trim();
      if(f.req&&!d[f.k]){$("#f2Err").textContent=f.l+"を入力してください";return;}}
    $("#f2S").disabled=true;const ok=await onSave(d,$("#f2Err"));$("#f2S").disabled=false;if(ok!==false)close();};
  if(onDelete){let armed=false;$("#f2Del").onclick=async()=>{if(!armed){armed=true;$("#f2Del").textContent="もう一度押すと削除（元に戻せません）";$("#f2Del").classList.add("arm");return;}

async function savePdca(id,mo,patch,errEl){

function bindPdca(id){
  const mo=pMonth(),d=()=>pDoc(id,mo);

  document.querySelectorAll("[data-ped]").forEach(b=>b.onclick=()=>{const k=b.dataset.ped;
    openForm2({title:deptOf(id).name+"｜"+moLabel(mo)+"の"+lab[k],fields:[{k,l:lab[k]+"（「- 」で始めると箇条書き）",t:"textarea",rows:10}],values:{[k]:d()[k]||""},onSave:(v,e)=>savePdca(id,mo,{[k]:v[k]},e)});});
  document.querySelectorAll("[data-pdo]").forEach(c=>c.onchange=()=>{const acts=(d().actions||[]).map(a=>a.id===c.dataset.pdo?{...a,done:c.checked,doneAt:c.checked?new Date().toISOString():null}:a);savePdca(id,mo,{actions:acts});});

  const ab=$("#pdAdd");if(ab){ab.onclick=add;$("#pdText").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();add();}};}
  const cb=$("#pCarry");if(cb)cb.onclick=async()=>{const nx=shiftMonth(mo,1),cur=pDoc(id,nx).plan||"";

/* 部門アプリへ渡す数字のスナップショット（kpisnap/{部門}_{月}） */
Object.assign(state,{kpisnap:{},snapReady:false});
let snapTimer=null;
function scheduleSnap(){if(!IS_MAIN||!state.isEditor||!state.snapReady||!state.clientsReady||!state.crmReady||!state.productsReady||!state.mktReady)return;clearTimeout(snapTimer);snapTimer=setTimeout(pushSnaps,3000);}
async function pushSnaps(){
  for(const D of DEPTS)for(const mo of [thisMonth(),shiftMonth(thisMonth(),-1)]){
    const K=kpiVals(D.id,mo),values={},targets={};
    K.forEach(x=>{if(x.v)values[x.k]=x.actual;if(x.target!=null)targets[x.k]=x.target;});
    const key=pKey(D.id,mo),old=state.kpisnap[key];
    if(old&&JSON.stringify(old.values)===JSON.stringify(values)&&JSON.stringify(old.targets||{})===JSON.stringify(targets))continue;
    const doc={dept:D.id,month:mo,values,targets,at:new Date().toISOString()};
    try{await state.db.doc("kpisnap/"+key).set(doc);state.kpisnap[key]=doc;}catch(e){return;}
  }
}
function mergePay(){state.clients=state.rawClients.map(c=>{const p=(state.payments[c.id]||{}).paid;return p?{...c,paid:{...(c.paid||{}),...p}}:c;});}
/* ===== 経理・財務（CFO） ===== */
const FREEE_URL="https://secure.freee.co.jp/";
function billingFor(mo){
  return state.clients.filter(c=>c.startDate&&c.status!=="prep"&&ym(c.startDate)<=mo&&!(c.endDate&&ym(c.endDate)<mo)&&!(c.status==="ended"&&!c.endDate&&mo===thisMonth())&&!(c.status==="paused"&&mo===thisMonth()))
    .map(c=>({c,amt:(+c.monthly||0)+(ym(c.startDate)===mo?(+c.initialFee||0):0),paid:!!(c.paid&&c.paid[mo])})).filter(x=>x.amt>0);
}

   <div class="kpi ${wait.length?"warn":""}"><small>入金待ち（直近12か月）</small><b>${wait.length}</b><span>件 ${yen(wait.reduce((a,x)=>a+x.amt,0))}</span></div>

    state.ready=true;$("#me").textContent="進捗はこの端末に保存されます";
  }catch(e){state.err="研修データを読み込めませんでした。";}
  render();
}
(async()=>{
